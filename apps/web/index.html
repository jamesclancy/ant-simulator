<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2a1b" />
    <title>Ant Simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="bar">
        <button id="pause" type="button" aria-label="Pause">Pause</button>
        <button id="layer" type="button" aria-label="Show nest">Nest</button>
        <button id="scent" type="button" aria-pressed="false">Scent vision</button>
        <div id="speeds" role="group" aria-label="Speed"></div>
        <button id="place-food" type="button" aria-pressed="false">Place food</button>
        <span id="stats"></span>
      </div>
    </div>
    <div id="player-hud">
      <div class="bar" role="group" aria-label="Player ant">
        <button id="p-trail" type="button" aria-pressed="false" title="Lay trail (hold Shift)">
          Trail
        </button>
        <button id="p-pickup" type="button" title="Pick up / drop (E)">Pick up</button>
        <button id="p-recruit5" type="button" title="Recruit 5 (R)">Recruit 5</button>
        <button id="p-recruit10" type="button">Recruit 10</button>
        <button id="p-release" type="button" disabled>Release</button>
        <button id="p-follow" type="button" aria-pressed="true">Follow</button>
        <span id="p-status"></span>
      </div>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
