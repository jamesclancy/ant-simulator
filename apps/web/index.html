<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d3316" />
    <meta
      name="description"
      content="Rule the yard. Lead your ant colony against the red colony."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ant Simulator" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Ant Simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="bar">
        <button id="pause" type="button" aria-label="Pause">Pause</button>
        <button id="layer" type="button" aria-label="Show nest">Nest</button>
        <button id="nest-switch" type="button" hidden>Red nest</button>
        <button id="scent" type="button" aria-pressed="false">Scent vision</button>
        <div id="speeds" role="group" aria-label="Speed"></div>
        <button id="saves" type="button" aria-expanded="false">Saves</button>
        <button id="mute" type="button" aria-pressed="false">Sound on</button>
        <button id="place-food" type="button" aria-pressed="false">Place food</button>
        <span id="hud-colonies">
          <span class="pop-black" id="pop-black" title="Black colony (yours)"></span>
          <span class="pop-red" id="pop-red" title="Red colony"></span>
        </span>
        <span id="stats"></span>
      </div>
    </div>
    <div id="player-hud">
      <div class="bar" role="group" aria-label="Player ant">
        <button id="p-trail" type="button" aria-pressed="false" title="Lay trail (hold Shift)">
          Trail
        </button>
        <button id="p-pickup" type="button" title="Pick up / drop (E)">Pick up</button>
        <button id="p-recruit5" type="button" title="Recruit 5 (R)">Recruit 5</button>
        <button id="p-recruit10" type="button">Recruit 10</button>
        <button id="p-release" type="button" disabled>Release</button>
        <button id="p-follow" type="button" aria-pressed="true">Follow</button>
        <span id="p-status"></span>
      </div>
    </div>
    <div id="toast" role="status"></div>
    <div id="gameover" role="dialog" aria-modal="true" aria-labelledby="gameover-title" hidden>
      <div class="card">
        <h2 id="gameover-title"></h2>
        <p id="gameover-text"></p>
        <div id="gameover-extra" hidden></div>
        <button id="play-again" type="button">Play again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
